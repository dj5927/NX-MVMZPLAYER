name: Publish Public Beta 0.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-beta.yml"
      - "source/**"
      - "tools/fetch_noto.ps1"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: source/SWITCH_HOS/package-lock.json

      - name: Install dependencies
        working-directory: source/SWITCH_HOS
        run: npm ci --no-audit --no-fund

      - name: Fetch verified Noto CJK font
        shell: pwsh
        run: ./tools/fetch_noto.ps1

      - name: Build launcher
        working-directory: source/SWITCH_HOS/SPLIT_RUNTIME/LAUNCHER
        run: npm run nro

      - name: Typecheck and build MV player
        working-directory: source/SWITCH_HOS/SPLIT_RUNTIME/MV_PLAYER
        run: |
          npm run typecheck
          npm run nro

      - name: Typecheck and build MZ player
        working-directory: source/SWITCH_HOS/SPLIT_RUNTIME/MZ_PLAYER
        run: |
          npm run typecheck
          npm run nro

      - name: Package Public Beta
        shell: bash
        run: |
          set -euo pipefail
          OUT="NX-MVMZPLAYER_Public_Beta_0.1.zip"
          mkdir -p mvmz
          mkdir -p switch/mvmzplayer/runtime

          cp source/SWITCH_HOS/SPLIT_RUNTIME/LAUNCHER/mvmz-split-launcher.nro switch/mvmzplayer/MVMZ_Launcher.nro
          cp source/SWITCH_HOS/SPLIT_RUNTIME/MV_PLAYER/mvmz-mv-player.nro switch/mvmzplayer/runtime/MVMZ_MV_Player.nro
          cp source/SWITCH_HOS/SPLIT_RUNTIME/MZ_PLAYER/mvmz-mz-player.nro switch/mvmzplayer/runtime/MVMZ_MZ_Player.nro

          cat > mvmz/HERE_GAME_FOLDER.txt <<'EOF'
NX-MVMZPLAYER GAME FOLDER

[한국어]
이 mvmz 폴더 안에 본인이 보유한 RPG Maker MV/MZ 게임 폴더를 넣으세요.

예시:
mvmz/MyGame/
mvmz/AnotherGame/

[English]
Place your RPG Maker MV/MZ game folders inside this mvmz folder.

Example:
mvmz/MyGame/
mvmz/AnotherGame/
EOF

          cp README_KR.md switch/mvmzplayer/README_KR.md
          cp README_EN.md switch/mvmzplayer/README_EN.md
          cp LICENSE switch/mvmzplayer/LICENSE
          cp THIRD_PARTY_NOTICES.md switch/mvmzplayer/THIRD_PARTY_NOTICES.md

          (
            cd switch/mvmzplayer
            sha256sum MVMZ_Launcher.nro runtime/MVMZ_MV_Player.nro runtime/MVMZ_MZ_Player.nro > SHA256SUMS.txt
          )

          rm -f "$OUT"
          zip -r -9 "$OUT" mvmz switch

      - name: Verify V044 binary hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "1682527AC3116C447B34586FC528981A40800296F7FCF6C1FCB9CFA4D7AF79E3  switch/mvmzplayer/MVMZ_Launcher.nro" > expected.sha256
          echo "AE1A3D49258E7D8A209A3509A4DD04C313A77807565037E538D178172769ED33  switch/mvmzplayer/runtime/MVMZ_MV_Player.nro" >> expected.sha256
          echo "97FCED4EABA82A1D2B2098AF9DACE1E3859486A4844E9F3B127E387DBEB6F64E  switch/mvmzplayer/runtime/MVMZ_MZ_Player.nro" >> expected.sha256
          sha256sum -c expected.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NX-MVMZPLAYER_Public_Beta_0.1
          path: NX-MVMZPLAYER_Public_Beta_0.1.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.0-beta"
          TITLE="NX-MVMZPLAYER Public Beta 0.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" NX-MVMZPLAYER_Public_Beta_0.1.zip --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --prerelease \
              --notes-file CHANGELOG.md
          else
            gh release create "$TAG" NX-MVMZPLAYER_Public_Beta_0.1.zip \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --prerelease \
              --notes-file CHANGELOG.md
          fi
