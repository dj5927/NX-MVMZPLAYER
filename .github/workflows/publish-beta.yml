name: Publish Public Beta 0.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-beta.yml"
      - "source/**"
      - "tools/fetch_noto.ps1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: source/SWITCH_HOS/package-lock.json

      - name: Install dependencies
        working-directory: source/SWITCH_HOS
        run: npm ci --no-audit --no-fund

      - name: Fetch verified Noto CJK font
        shell: pwsh
        run: ./tools/fetch_noto.ps1

      - name: Build launcher
        working-directory: source/SWITCH_HOS/SPLIT_RUNTIME/LAUNCHER
        run: npm run nro

      - name: Typecheck and build MV player
        working-directory: source/SWITCH_HOS/SPLIT_RUNTIME/MV_PLAYER
        run: |
          npm run typecheck
          npm run nro

      - name: Typecheck and build MZ player
        working-directory: source/SWITCH_HOS/SPLIT_RUNTIME/MZ_PLAYER
        run: |
          npm run typecheck
          npm run nro

      - name: Package Public Beta
        shell: bash
        run: |
          set -euo pipefail
          PKG="NX-MVMZPLAYER_Public_Beta_0.1"
          mkdir -p "$PKG/runtime"
          cp source/SWITCH_HOS/SPLIT_RUNTIME/LAUNCHER/mvmz-split-launcher.nro "$PKG/MVMZ_Launcher.nro"
          cp source/SWITCH_HOS/SPLIT_RUNTIME/MV_PLAYER/mvmz-mv-player.nro "$PKG/runtime/MVMZ_MV_Player.nro"
          cp source/SWITCH_HOS/SPLIT_RUNTIME/MZ_PLAYER/mvmz-mz-player.nro "$PKG/runtime/MVMZ_MZ_Player.nro"
          cp README_KR.md "$PKG/README_KR.md"
          cp README_EN.md "$PKG/README_EN.md"
          cp LICENSE "$PKG/LICENSE"
          cp THIRD_PARTY_NOTICES.md "$PKG/THIRD_PARTY_NOTICES.md"
          (
            cd "$PKG"
            sha256sum MVMZ_Launcher.nro runtime/MVMZ_MV_Player.nro runtime/MVMZ_MZ_Player.nro > SHA256SUMS.txt
          )
          zip -r -9 "$PKG.zip" "$PKG"

      - name: Verify V044 binary hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "1682527AC3116C447B34586FC528981A40800296F7FCF6C1FCB9CFA4D7AF79E3  NX-MVMZPLAYER_Public_Beta_0.1/MVMZ_Launcher.nro" > expected.sha256
          echo "AE1A3D49258E7D8A209A3509A4DD04C313A77807565037E538D178172769ED33  NX-MVMZPLAYER_Public_Beta_0.1/runtime/MVMZ_MV_Player.nro" >> expected.sha256
          echo "97FCED4EABA82A1D2B2098AF9DACE1E3859486A4844E9F3B127E387DBEB6F64E  NX-MVMZPLAYER_Public_Beta_0.1/runtime/MVMZ_MZ_Player.nro" >> expected.sha256
          sha256sum -c expected.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NX-MVMZPLAYER_Public_Beta_0.1
          path: NX-MVMZPLAYER_Public_Beta_0.1.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.0-beta"
          TITLE="NX-MVMZPLAYER Public Beta 0.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" NX-MVMZPLAYER_Public_Beta_0.1.zip --clobber
          else
            gh release create "$TAG" NX-MVMZPLAYER_Public_Beta_0.1.zip \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --prerelease \
              --notes-file CHANGELOG.md
          fi
