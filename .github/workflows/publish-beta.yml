name: Verify main build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-beta.yml"
      - ".github/workflows/release.yml"
      - "source/**"
      - "tools/**"
      - "README*.md"
      - "CHANGELOG.md"
      - "THIRD_PARTY_NOTICES.md"
      - "RELEASE_POLICY.md"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: source/SWITCH_HOS/package-lock.json

      - name: Install dependencies
        working-directory: source/SWITCH_HOS
        run: npm ci --no-audit --no-fund

      - name: Fetch verified Noto CJK font
        shell: pwsh
        run: ./tools/fetch_noto.ps1

      - name: Build launcher
        working-directory: source/SWITCH_HOS/SPLIT_RUNTIME/LAUNCHER
        run: npm run nro

      - name: Typecheck and build MV player
        working-directory: source/SWITCH_HOS/SPLIT_RUNTIME/MV_PLAYER
        run: |
          npm run typecheck
          npm run nro

      - name: Typecheck and build MZ player
        working-directory: source/SWITCH_HOS/SPLIT_RUNTIME/MZ_PLAYER
        run: |
          npm run typecheck
          npm run nro

      - name: Build SD-card layout artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/mvmz
          mkdir -p artifact/switch/mvmzplayer/runtime

          cp source/SWITCH_HOS/SPLIT_RUNTIME/LAUNCHER/mvmz-split-launcher.nro artifact/switch/mvmzplayer/MVMZ_Launcher.nro
          cp source/SWITCH_HOS/SPLIT_RUNTIME/MV_PLAYER/mvmz-mv-player.nro artifact/switch/mvmzplayer/runtime/MVMZ_MV_Player.nro
          cp source/SWITCH_HOS/SPLIT_RUNTIME/MZ_PLAYER/mvmz-mz-player.nro artifact/switch/mvmzplayer/runtime/MVMZ_MZ_Player.nro
          cp -R source/SWITCH_HOS/COMPAT_PACK artifact/switch/mvmzplayer/_compat

          printf '%s\n' \
            'NX-MVMZPLAYER GAME FOLDER' \
            '' \
            'PLACE YOUR RPG MAKER MV/MZ GAME FOLDERS HERE.' \
            '' \
            'Example:' \
            'mvmz/MyGame/' \
            'mvmz/AnotherGame/' \
            > artifact/mvmz/HERE_GAME_FOLDER.txt

          cp README_KR.md artifact/switch/mvmzplayer/README_KR.md
          cp README_EN.md artifact/switch/mvmzplayer/README_EN.md
          cp LICENSE artifact/switch/mvmzplayer/LICENSE
          cp THIRD_PARTY_NOTICES.md artifact/switch/mvmzplayer/THIRD_PARTY_NOTICES.md

          (
            cd artifact/switch/mvmzplayer
            sha256sum MVMZ_Launcher.nro runtime/MVMZ_MV_Player.nro runtime/MVMZ_MZ_Player.nro > SHA256SUMS.txt
            find _compat -type f -print0 | sort -z | xargs -0 sha256sum >> SHA256SUMS.txt
          )

          (
            cd artifact
            zip -r -9 ../NX-MVMZPLAYER_CI.zip mvmz switch
          )

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: NX-MVMZPLAYER_CI
          path: NX-MVMZPLAYER_CI.zip
